name: Deploy to Railway

on:
  push:
    branches: [main, claude/*]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Railway environment to deploy to'
        required: false
        default: ''
      service:
        description: 'Railway service to deploy to'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Link environment
        if: ${{ github.event.inputs.environment != '' }}
        run: railway environment ${{ github.event.inputs.environment }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Link service
        if: ${{ github.event.inputs.service != '' }}
        run: railway service ${{ github.event.inputs.service }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy to Railway
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
